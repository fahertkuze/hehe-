# Jenis karya penelitian yang dikenali. Kunci (kiri) dipakai di kolom
# "jenis" pada setiap file di _penelitian/. Label (kanan) adalah teks
# yang tampil di situs. Anda boleh menambah jenis baru.
jurnal:     { label: "Journal Article",        bibtex: "article" }
prosiding:  { label: "Conference Paper",       bibtex: "inproceedings" }
preprint:   { label: "Preprint",               bibtex: "misc" }
tesis:      { label: "Thesis",                 bibtex: "mastersthesis" }
laporan:    { label: "Research Report",        bibtex: "techreport" }
dataset:    { label: "Dataset",                bibtex: "misc" }
presentasi: { label: "Presentation / Poster",  bibtex: "misc" }
buku:       { label: "Book / Chapter",         bibtex: "book" }
