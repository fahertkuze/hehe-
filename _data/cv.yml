# ============================================================
#  CV — setiap bagian akan tampil di halaman CV (urutan sesuai file ini).
#  Semua isi di bawah masih CONTOH/templat: ganti teks di dalam tanda
#  kutip dengan data Anda (dalam bahasa Inggris).
#  Hapus bagian yang tidak diperlukan, atau tambah item baru dengan
#  menyalin pola yang sama (perhatikan jumlah spasi di awal baris).
#
#  Kolom umum per item:
#    judul     : posisi / gelar / nama penghargaan
#    tempat    : institusi / penyelenggara
#    periode   : teks bebas, mis. "2021 – present"
#    keterangan: (opsional) penjelasan singkat
#    poin      : (opsional) daftar butir
# ============================================================

pendidikan:
  - judul: "Science Program (Senior High School)"
    tempat: "MAN Insan Cendekia Gorontalo"
    periode: "2024 – 2027"
    keterangan: "Astronomy Enthusiast & Founder of Pengamat Langit."

pengalaman:
  - judul: "Position Title"
    tempat: "Organization Name"
    periode: "20XX – present"
    poin:
      - "Describe a key responsibility or achievement."
      - "Add another one here, or delete this line."

penghargaan:
  - judul: "Award, Competition, or Grant Name"
    tempat: "Awarding Institution"
    periode: "20XX"

organisasi:
  - judul: "Member"
    tempat: "Organization Name"
    periode: "20XX – present"

# Keahlian dikelompokkan per kategori.
keahlian:
  - kategori: "Research"
    daftar: ["Skill one", "Skill two", "Skill three"]
  - kategori: "Tools"
    daftar: ["Tool one", "Tool two"]
  - kategori: "Languages"
    daftar: ["Indonesian (native)", "English"]
